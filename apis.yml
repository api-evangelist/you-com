aid: you-com
name: You.com
description: You.com runs an AI search and chat product alongside a developer platform
  that exposes web search APIs designed for AI systems, agents, and LLMs. The platform
  offers Search, Web Search, Contents, News, Smart, Research, and Finance Research
  APIs for grounding LLMs in real-time web data. You.com publishes benchmark wins
  on DeepSearchQA and FinSearchComp and targets 300ms p99 latency with 99.99% uptime
  and SOC 2 enterprise controls. APIs use X-API-Key authentication and a Python SDK
  is available. Free trial access is provided through the platform dashboard with
  enterprise options including zero data retention.
